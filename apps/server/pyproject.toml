# Modified for Poker House.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poker-house-server"
version = "0.1.0"
description = "Local poker matches and structured remote bot protocol."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = ["poker-house-engine==0.1.0"]

[project.scripts]
poker-house = "poker_house_server.cli:main"
poker-house-play = "poker_house_server.play:main"
poker-house-bot = "poker_house_server.remote_bot_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/poker_house_server"]

[tool.pyink]
line-length = 80
unstable = true
target-version = []
pyink-indentation = 2
pyink-use-majority-quotes = true
pyink-annotation-pragmas = [
    "noqa",
    "pylint:",
    "type: ignore",
    "pytype:",
    "mypy:",
    "pyright:",
    "pyre-",
]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
follow_imports = "silent"
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]

# pyspiel has no stubs, and the rest of OpenSpiel is not annotated.
[[tool.mypy.overrides]]
module = [
    "pyspiel",
    "open_spiel.python.algorithms",
    "open_spiel.python.algorithms.*",
    "open_spiel.python.games",
    "open_spiel.python.games.*",
]
ignore_missing_imports = true

# absltest's assertLen and assertEmpty carry no annotations. mypy names a
# method call by the caller's class (CliTest.assertLen), so
# untyped_calls_exclude cannot reach them; the tests that call them are listed.
[[tool.mypy.overrides]]
module = [
    "poker_house_server.api_test",
    "poker_house_server.cli_test",
    "poker_house_server.controllers_test",
    "poker_house_server.server_test",
    "poker_house_server.session_history_test",
    "poker_house_server.session_test",
    "poker_house_server.store_test",
]
disallow_untyped_calls = false

# Google Python Style Guide settings, with OpenSpiel's two-space indentation.
# The too-many-* design checks stay off, as in Google's own pylintrc; the
# style guide's size rules are max-module-lines and max-statements below.
# fixme is on: the style guide allows no TODO or FIXME.
[tool.pylint.main]
py-version = "3.11"
jobs = 0
persistent = false
ignored-modules = ["pyspiel"]

[tool.pylint."messages control"]
disable = [
    "duplicate-code",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-boolean-expressions",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-return-statements",
    "wrong-import-order",
]
enable = ["useless-suppression"]

[tool.pylint.format]
indent-string = "  "
indent-after-paren = 4
max-line-length = 80
# 600, not the TypeScript 500: pylint counts docstrings and comments.
max-module-lines = 600
ignore-long-lines = '^\s*(# )?<?https?://\S+>?$'

[tool.pylint.design]
max-statements = 50

[tool.pylint.basic]
# The Google guide's single letters: counters, a caught exception, a file.
good-names = ["_", "i", "j", "k", "e", "f"]
argument-rgx = '^[a-z][a-z0-9_]*$'
attr-rgx = '^_{0,2}[a-z][a-z0-9_]*$'
class-attribute-rgx = '^(_?[A-Z][A-Z0-9_]*|__[a-z0-9_]+__|_?[a-z][a-z0-9_]*)$'
class-rgx = '^_?[A-Z][a-zA-Z0-9]*$'
const-rgx = '^(_?[A-Z][A-Z0-9_]*|__[a-z0-9_]+__|_?[a-z][a-z0-9_]*)$'
function-rgx = '^(?:(?P<exempt>setUp|tearDown|setUpModule|tearDownModule)|(?P<camel_case>_?[A-Z][a-zA-Z0-9]*)|(?P<snake_case>_?[a-z][a-z0-9_]*))$'
inlinevar-rgx = '^[a-z][a-z0-9_]*$'
method-rgx = '(?x)^(?:(?P<exempt>_[a-z0-9_]+__|runTest|setUp|tearDown|setUpTestCase|tearDownTestCase|setupSelf|tearDownClass|setUpClass|(test|assert)_*[A-Z0-9][a-zA-Z0-9_]*|next)|(?P<camel_case>_{0,2}[A-Z][a-zA-Z0-9_]*)|(?P<snake_case>_{0,2}[a-z][a-z0-9_]*))$'
module-rgx = '^(_?[a-z][a-z0-9_]*|__init__|__main__)$'
variable-rgx = '^[a-z][a-z0-9_]*$'
no-docstring-rgx = '(__.*__|main|test.*|.*test|.*Test)$'
