# Modified for Poker House.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poker-house-server"
version = "0.1.0"
description = "Local poker matches and structured remote bot protocol."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = ["poker-house-engine==0.1.0"]

[project.scripts]
poker-house = "poker_house_server.cli:main"
poker-house-play = "poker_house_server.play:main"
poker-house-bot = "poker_house_server.remote_bot_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/poker_house_server"]
