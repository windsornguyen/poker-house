# Modified for Doggybank.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doggybank-server"
version = "0.1.0"
description = "The Doggybank poker server and its HTTP API."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14,<3.15"
dependencies = [
  "doggybank-engine==0.1.0",
  "fastapi==0.165.0",
  "httptools==0.9.0",
  "psycopg[binary]==3.3.9",
  "pydantic==2.13.5",
  "sse-starlette==3.7.1",
  "uvicorn==0.54.0",
  "uvloop==0.23.0",
]

[project.scripts]
doggybank = "doggybank_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doggybank_server"]
