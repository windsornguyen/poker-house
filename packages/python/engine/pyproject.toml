[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doggybank-engine"
version = "0.1.0"
description = "PokerKit games and private bot observations for Doggybank."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14,<3.15"
dependencies = [
  "absl-py>=2,<3",
  "numpy>=2,<3",
  "open-spiel==2.0.2",
  "pokerkit==0.6.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/doggybank_engine"]
