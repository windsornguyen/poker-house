[tool.uv.workspace]
members = ["apps/server", "apps/players", "packages/python/engine"]

[tool.uv.sources]
poker-house-engine = { workspace = true }
poker-house-server = { workspace = true }
poker-house-players = { workspace = true }

[dependency-groups]
check = ["ruff==0.17.6", "ty==0.0.112"]
test = ["hypothesis==6.170.22"]

[tool.ruff]
line-length = 100
extend-exclude = ["typings"]
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "RET"]

[tool.ruff.lint.isort]
known-first-party = ["poker_house_engine", "poker_house_players", "poker_house_server"]

[tool.ty.environment]
python = "./.venv"
extra-paths = ["typings"]

[tool.ty.src]
exclude = ["typings"]

[tool.ty.rules]
possibly-unresolved-reference = "error"
