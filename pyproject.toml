[tool.uv.workspace]
members = ["apps/server", "packages/python/engine"]

[tool.uv.sources]
poker-house-engine = { workspace = true }
poker-house-server = { workspace = true }

[dependency-groups]
check = ["mypy==2.4.0", "pyink==24.10.1", "pylint==4.1.3"]

[tool.pyink]
